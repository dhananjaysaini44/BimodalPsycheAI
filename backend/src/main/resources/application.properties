spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bimodalpsyche}
spring.datasource.username=${MYSQLUSER:root }
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}

spring.jackson.deserialization.fail-on-unknown-properties=true

# Never leak stack traces or exception messages in error responses
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Refresh-token cookie is Secure by default; set COOKIE_SECURE=false only for plain-http dev setups
app.cookie.secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.legal.terms-version=${TERMS_VERSION:v1}
app.legal.privacy-policy-version=${PRIVACY_POLICY_VERSION:v1}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
